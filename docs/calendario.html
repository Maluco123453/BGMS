<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
    <title>BGMS | Calendário</title>
</head>

<body class="calendario">

    <h1>Calendário</h1>

    <div class="controles-calendario">

        <button class="botao-jogo" id="pular-1">+1 Dia</button>

        <button class="botao-jogo" id="pular-7">+7 Dias</button>

        <button class="botao-jogo" id="pular-deadline">Deadline</button>

        <button class="botao-jogo" id="pular-allstar">All-Star</button>

        <button class="botao-jogo" id="pular-fim">Fim da Temporada</button>

    </div>

    <div id="lista-calendario"></div>

    <div class="barra-menu">

        <button class="menu-item" data-pagina="inicio">
            <span>⌂</span>
            Início
        </button>

        <button class="menu-item" data-pagina="elenco">
            <span>♟</span>
            Elenco
        </button>

        <button class="menu-item ativo" data-pagina="jogos">
            <span>▣</span>
            Jogos
        </button>

        <button class="menu-item" data-pagina="liga">
            <span>★</span>
            Liga
        </button>

        <button class="menu-item" data-pagina="mais">
            <span>☰</span>
            Mais
        </button>

    </div>

</body>

</html>
