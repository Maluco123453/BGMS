<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
    <title>BGMS | Menu</title>
</head>

<body class="menu-jogo">

    <div class="topo-jogo">

        <div class="logo-time" id="logo-time">S</div>

        <div class="info-time">
            <h1 id="nome-time">Storm</h1>
            <p>Temporada <span id="ano-time">2027</span></p>
        </div>

    </div>

    <div class="painel-principal">

        <h2 id="nome-time-painel">Storm</h2>

        <p class="subtitulo">Sua temporada</p>

        <div class="resumo">

            <div>
                <span>Record</span>
                <strong id="record">0 - 0</strong>
            </div>

            <div>
                <span>Posição</span>
                <strong id="posicao">-</strong>
            </div>

            <div>
                <span>Cap Space</span>
                <strong>$0M</strong>
            </div>

        </div>

        <div class="proximo-jogo">

            <p>PRÓXIMO JOGO</p>

            <h3 id="time-casa">Storm</h3>

            <span>VS</span>

            <h3 id="time-adversario">Wolves</h3>

            <small id="info-proximo-jogo">Temporada ainda não começou</small>

        </div>

    </div>

    <div class="barra-menu">

        <button class="menu-item ativo" data-pagina="inicio">
            <span>⌂</span>
            Início
        </button>

        <button class="menu-item" data-pagina="elenco">
            <span>♟</span>
            Elenco
        </button>

        <button class="menu-item" data-pagina="jogos">
            <span>▣</span>
            Jogos
        </button>

        <button class="menu-item" data-pagina="liga">
            <span>★</span>
            Liga
        </button>

        <button class="menu-item" data-pagina="mais">
            <span>☰</span>
            Mais
        </button>

    </div>

</body>

</html>
